<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>[ØT\W] // ARCHIVE</title>
  <style>
    :root {
      --bg: #070809;
      --card-bg: #0c0f13;
      --border: #1a1e24;
      --text-main: #f0f3f6;
      --text-muted: #6e7681;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", monospace;
      margin: 0;
      padding: 24px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    header {
      width: 100%;
      max-width: 1080px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-title {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .back-btn {
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      text-decoration: none;
      transition: all 0.15s ease;
      background: var(--card-bg);
    }
    .back-btn:hover {
      color: #fff;
      border-color: #30363d;
    }
    .badge {
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1080px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      border-color: #30363d;
      transform: translateY(-2px);
    }
    .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img.thumb {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .watermark-tag {
      position: absolute;
      bottom: 8px;
      right: 10px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 600;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .caption {
      font-size: 11px;
      color: var(--text-muted);
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      margin-top: auto;
      letter-spacing: 0.5px;
    }
    .caption .action {
      color: #9da7b3;
      font-weight: 500;
    }

    /* FULLSCREEN LIGHTBOX DLA POJEDYNCZEGO PROJEKTU */
    #modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 5, 6, 0.96);
      backdrop-filter: blur(12px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 16px;
      touch-action: none;
    }
    #modal.open { display: flex; }
    #modal-img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      transition: opacity 0.15s ease;
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(13, 17, 23, 0.6);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 28px;
      width: 48px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
      backdrop-filter: blur(4px);
      z-index: 10001;
    }
    .nav-prev { left: 16px; }
    .nav-next { right: 16px; }
    .modal-meta {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-top: 12px;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10001;
    }
    .controls a, .controls button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 16px;
      font-size: 11px;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a id="back-nav" href="#" class="back-btn" style="display:none;">← ALL PROJECTS</a>
      <div class="brand-title" id="title">[ØT\W] // ARCHIVE</div>
    </div>
    <div class="badge" id="badge-info">COLLECTIONS</div>
  </header>

  <div class="grid" id="gallery"></div>

  <!-- Fullscreen Modal -->
  <div id="modal">
    <div class="nav-btn nav-prev" onclick="navPrev()">‹</div>
    <div class="nav-btn nav-next" onclick="navNext()">›</div>
    <img id="modal-img" src="" alt="Full-Res Still">
    <div class="modal-meta" id="modal-counter">FRAME 01</div>
    <div class="controls">
      <a id="modal-download" href="" target="_blank" download>DOWNLOAD FULL-RES</a>
      <button onclick="closeModal()">CLOSE [ESC]</button>
    </div>
  </div>

  <script>
    /* ==============================================================
       LISTA  PROJEKTÓW:
       
       nazwa folderu w nowej linijce poniżej!k
       ============================================================== */
    const PROJECTS = [
      'FLUX_Vessel',
      'FERROS_SundayBlooms',
      'TICKER_Polyhedrons',
      // 'NOWY_PROJEKT', <-- takdodaje się kolejne
    ];

    const EXTENSIONS = ['png', 'PNG', 'jpg', 'JPG', 'jpeg', 'webp', 'png.jpg', 'png.PNG', 'png.jpeg', 'PNG.jpg'];

    let basePath = window.location.pathname;
    if (!basePath.endsWith('/')) basePath += '/';

    const urlParams = new URLSearchParams(window.location.search);
    const sessionID = urlParams.get('id');

    const gallery = document.getElementById('gallery');
    const titleEl = document.getElementById('title');
    const badgeEl = document.getElementById('badge-info');
    const backNav = document.getElementById('back-nav');

    // -------------------------------------------------------------
    // TRYB 1: KATALOG GŁÓWNY (gdy URL to czysty: otwaves.github.io/Gallery/)
    // -------------------------------------------------------------
    if (!sessionID) {
      titleEl.innerText = `[ØT\\W] // PROJECTS ARCHIVE`;
      badgeEl.innerText = `${PROJECTS.length} COLLECTIONS`;
      backNav.style.display = 'none';

      PROJECTS.forEach(projId => {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = `${basePath}?id=${projId}`;

        const imgWrap = document.createElement('div');
        imgWrap.className = 'img-wrap';

        const img = document.createElement('img');
        img.className = 'thumb';
        img.alt = projId;
        img.loading = 'lazy';

        // Ładuje miniaturę (still_01 z danego folderu)
        let extIdx = 0;
        function tryNextThumb() {
          if (extIdx < EXTENSIONS.length) {
            img.src = `${basePath}${projId}/still_01.${EXTENSIONS[extIdx]}`;
            extIdx++;
          }
        }
        img.onerror = tryNextThumb;
        tryNextThumb();

        const watermark = document.createElement('div');
        watermark.className = 'watermark-tag';
        watermark.innerText = '[ØT\\W]';

        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.innerHTML = `<span>${projId.replace(/_/g, ' ')}</span><span class="action">ENTER [→]</span>`;

        imgWrap.appendChild(img);
        imgWrap.appendChild(watermark);
        card.appendChild(imgWrap);
        card.appendChild(caption);
        gallery.appendChild(card);
      });

    // -------------------------------------------------------------
    // TRYB 2: WIDOK POJEDYNCZEGO PROJEKTU (?id=NAZWA_PROJEKTU)
    // -------------------------------------------------------------
    } else {
      titleEl.innerText = `[ØT\\W] // ${sessionID.replace(/_/g, ' ')}`;
      badgeEl.innerText = `FULL RES ARCHIVE`;
      backNav.style.display = 'inline-block';
      backNav.href = basePath;

      const MAX_FRAMES = 12;
      const activeStills = [];
      let currentIndex = 0;

      for (let i = 1; i <= MAX_FRAMES; i++) {
        const pad = i < 10 ? `0${i}` : `${i}`;
        const baseName = `still_${pad}`;

        const card = document.createElement('div');
        card.className = 'card';

        const imgWrap = document.createElement('div');
        imgWrap.className = 'img-wrap';

        const img = document.createElement('img');
        img.className = 'thumb';
        img.alt = `FRAME ${pad}`;
        img.loading = 'lazy';

        let extIndex = 0;
        function tryNextSource() {
          if (extIndex < EXTENSIONS.length) {
            img.src = `${basePath}${sessionID}/${baseName}.${EXTENSIONS[extIndex]}`;
            extIndex++;
          } else {
            card.remove();
          }
        }

        img.onload = () => {
          if (!activeStills.some(item => item.pad === pad)) {
            activeStills.push({ pad: pad, src: img.src });
            activeStills.sort((a, b) => parseInt(a.pad) - parseInt(b.pad));
          }
        };

        img.onerror = tryNextSource;
        tryNextSource();

        card.onclick = () => {
          const foundIdx = activeStills.findIndex(item => item.pad === pad);
          if (foundIdx !== -1) openModalAt(foundIdx);
        };

        const watermark = document.createElement('div');
        watermark.className = 'watermark-tag';
        watermark.innerText = '[ØT\\W]';

        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.innerHTML = `<span>FRAME ${pad}</span><span class="action">VIEW FULL-RES</span>`;

        imgWrap.appendChild(img);
        imgWrap.appendChild(watermark);
        card.appendChild(imgWrap);
        card.appendChild(caption);
        gallery.appendChild(card);
      }

      // MODAL / LIGHTBOX
      const modal = document.getElementById('modal');
      const modalImg = document.getElementById('modal-img');
      const dlBtn = document.getElementById('modal-download');
      const modalCounter = document.getElementById('modal-counter');

      function openModalAt(index) {
        if (!activeStills.length) return;
        currentIndex = index;
        renderModal();
        modal.classList.add('open');
      }

      function renderModal() {
        const item = activeStills[currentIndex];
        modalImg.style.opacity = '0.4';
        modalImg.src = item.src;
        modalImg.onload = () => { modalImg.style.opacity = '1'; };
        dlBtn.href = item.src;
        modalCounter.innerText = `FRAME ${item.pad} // ${activeStills.length < 10 ? '0' + activeStills.length : activeStills.length}`;
      }

      window.navPrev = function() {
        if (!activeStills.length) return;
        currentIndex = (currentIndex - 1 + activeStills.length) % activeStills.length;
        renderModal();
      };

      window.navNext = function() {
        if (!activeStills.length) return;
        currentIndex = (currentIndex + 1) % activeStills.length;
        renderModal();
      };

      window.closeModal = function() {
        modal.classList.remove('open');
      };

      modal.onclick = (e) => {
        if (e.target.id === 'modal') closeModal();
      };

      document.addEventListener('keydown', (e) => {
        if (!modal.classList.contains('open')) return;
        if (e.key === 'ArrowRight') navNext();
        if (e.key === 'ArrowLeft') navPrev();
        if (e.key === 'Escape') closeModal();
      });

      let touchStartX = 0;
      modal.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      modal.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (diff < -45) navNext();
        if (diff > 45) navPrev();
      }, { passive: true });
    }
  </script>
</body>
</html>
